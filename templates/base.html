<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Öffentliches-Gut-Spiel</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}">
    {% block head %}{% endblock %}
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="logo">
                <i class="fas fa-users"></i>
                Öffentliches-Gut-Spiel
            </div>
        </nav>
        <div class="connection-status connected" id="connectionStatus" style="display: none;">
            ✅ Verbunden
        </div>
    </header>

    <!-- Session-Daten sicher als JSON-Block – kein direktes Einbetten in JS-Strings -->
    <script type="application/json" id="session-data">
    {
        "roomId":   {{ session.get("room_id",   "")    | tojson }},
        "playerId": {{ session.get("player_id", "")    | tojson }},
        "isLeader": {{ session.get("is_leader", false) | tojson }}
    }
    </script>

    <main>
        {% block body %}{% endblock %}
    </main>

    <footer>
        <p>WI24   Max Schieck   Justin Burian</p>
    </footer>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <script>
        // Globale Variablen
        const socket = io({
            transports: ['websocket'],
            upgrade: false
        });
    
        // Session-Daten sicher aus JSON-Block lesen (kein XSS-Risiko)
        const _sd = JSON.parse(document.getElementById('session-data').textContent);
        const currentRoomId  = _sd.roomId   || '';
        const currentPlayerId = _sd.playerId || '';
        const isLeader        = _sd.isLeader === true;

        console.log('DEBUG: Session-Daten - Raum:', currentRoomId, 'Spieler:', currentPlayerId, 'Leader:', isLeader);

        // localStorage-Persistenz: Speichert Sitzungsdaten damit Rejoin
        // nach Browser-Schließen möglich ist (Session-Cookie kann gelöscht werden).
        // Gilt für Spieler und Leader gleichermaßen – /rejoin leitet anhand
        // is_leader zur richtigen Seite (Dashboard vs. Spielseite).
        if (currentPlayerId && currentRoomId) {
            localStorage.setItem('gueterspiel_session', JSON.stringify({
                player_id: currentPlayerId,
                room_id:   currentRoomId,
                is_leader: isLeader
            }));
        }

        // Verbindungsstatus
        let hasJoinedRoomViaSocket = false;
        let reconnectAttempts = 0;
        const maxReconnectAttempts = 5;

        socket.on('connect', function() {
            console.log('DEBUG: Mit Server verbunden, Socket ID:', socket.id);
            updateConnectionStatus(true);
            reconnectAttempts = 0;

            if (currentRoomId && !hasJoinedRoomViaSocket) {
                console.log('DEBUG: Sende join_game_room für Raum:', currentRoomId);
                socket.emit('join_game_room', { room_id: currentRoomId });
                hasJoinedRoomViaSocket = true;
            }
        });
        
        socket.on('disconnect', function(reason) {
            console.log('DEBUG: Socket disconnected:', reason);
            hasJoinedRoomViaSocket = false;
            updateConnectionStatus(false);
            
            if (reason === 'io server disconnect') {
                // Server hat Verbindung getrennt - sofort reconnecten
                socket.connect();
            } else {
                // Automatischer Reconnect nach Verzögerung
                const delay = Math.min(1000 * Math.pow(2, reconnectAttempts), 30000);
                reconnectAttempts++;
                
                if (reconnectAttempts <= maxReconnectAttempts) {
                    setTimeout(() => {
                        if (!socket.connected) {
                            socket.connect();
                        }
                    }, delay);
                }
            }
        });

        socket.on('error', function(data) {
            console.error('WebSocket Error:', data);
            showNotification(data.message, 'error', 5000);
        });

        socket.on('connect_error', function(error) {
            console.error('DEBUG: Socket connection error:', error);
            updateConnectionStatus(false);
        });
        
        function updateConnectionStatus(connected) {
            const statusElement = document.getElementById('connectionStatus');
            if (statusElement) {
                statusElement.textContent = connected ? '✅ Verbunden' : '❌ Getrennt';
                statusElement.className = `connection-status ${connected ? 'connected' : 'disconnected'}`;
            }
        }
        
        // Utility-Funktionen

        /** Escapet HTML-Sonderzeichen – schützt gegen XSS bei innerHTML-Einfügungen. */
        function escHtml(str) {
            return String(str)
                .replace(/&/g, '&amp;')
                .replace(/</g, '&lt;')
                .replace(/>/g, '&gt;')
                .replace(/"/g, '&quot;')
                .replace(/'/g, '&#39;');
        }

        function showNotification(message, type = 'info', duration = 5000) {
            // Erstelle Flash-Message Container falls nicht vorhanden
            let flashContainer = document.getElementById('flash-messages');
            if (!flashContainer) {
                flashContainer = document.createElement('div');
                flashContainer.id = 'flash-messages';
                flashContainer.className = 'flash-messages';
                document.body.appendChild(flashContainer);
            }
            
            const flash = document.createElement('div');
            flash.className = `flash ${type}`;
            flash.innerHTML = `
                <span>${message}</span>
                <button onclick="this.parentElement.remove()" style="margin-left: 10px; background: none; border: none; color: white; cursor: pointer;">×</button>
            `;
            
            flashContainer.appendChild(flash);
            
            if (duration > 0) {
                setTimeout(() => {
                    if (flash.parentElement) {
                        flash.remove();
                    }
                }, duration);
            }
        }
        
        // Automatisches Ausblenden von Flash-Messages
        document.addEventListener('DOMContentLoaded', function() {
            const flashes = document.querySelectorAll('.flash');
            flashes.forEach(flash => {
                setTimeout(() => {
                    flash.style.opacity = '0';
                    setTimeout(() => flash.remove(), 300);
                }, 5000);
            });
            
            // Initialisiere Verbindungsstatus
            updateConnectionStatus(socket.connected);
        });

        /* --- Gemeinsame Timer-Utilities (für game.html + leader_dashboard.html) --- */

        // Globale Variablen für shared countdown (kann pro-Seite überschrieben werden)
        window.sharedLocalInterval = null;

        /**
         * Berechnet den absoluten Ablaufzeitpunkt (ms seit Epoch) aus dem Server-Timer-Payload.
         * Der Server sendet start_time (ms) + duration (s) einmalig beim Rundenstart / Reconnect.
         * Der Client rechnet daraus die verbleibende Zeit selbst – kein per-Sekunde-Push nötig.
         */
        function computeExpiresAtMs(timer) {
            if (!timer) return null;
            if (timer.start_time && timer.duration) {
                // server_now_ms kompensiert Clock-Skew zwischen Server und Client-Browser.
                // Render-Server läuft typischerweise einige Sekunden hinter dem Client.
                // skew > 0  → Server ist hinter Client  → expiresAt muss weiter in der Zukunft liegen
                const skew = timer.server_now_ms ? (Date.now() - timer.server_now_ms) : 0;
                return timer.start_time + timer.duration * 1000 + skew;
            }
            // Fallback: time_left vorhanden (z.B. bei gestopptem Timer)
            if (typeof timer.time_left !== 'undefined') {
                return Date.now() + Number(timer.time_left) * 1000;
            }
            return null;
        }

        // Alias für alten Namen – verhindert Fehler falls noch irgendwo genutzt
        function computeServerTimeLeftFromServerTimer(timer) {
            const exp = computeExpiresAtMs(timer);
            if (exp === null) return null;
            return Math.max(0, Math.ceil((exp - Date.now()) / 1000));
        }

        /**
         * Startet einen lokalen Countdown bis zum absoluten Zeitpunkt expiresAtMs.
         * - updateCb(seconds, ms) wird bei jedem Tick aufgerufen.
         * - expireCb() wird einmalig beim Ablauf aufgerufen.
         * Rückgabe: Objekt mit stop()-Methode.
         */
        function startSharedLocalCountdown(expiresAtMs, updateCb, expireCb, tickMs = 200) {
            if (window.sharedLocalInterval) {
                clearInterval(window.sharedLocalInterval);
                window.sharedLocalInterval = null;
            }

            window.sharedLocalInterval = setInterval(() => {
                const remainingMs  = expiresAtMs - Date.now();
                const remainingSec = Math.max(0, Math.ceil(remainingMs / 1000));

                if (typeof updateCb === 'function') updateCb(remainingSec, remainingMs);

                if (remainingMs <= 0) {
                    clearInterval(window.sharedLocalInterval);
                    window.sharedLocalInterval = null;
                    if (typeof updateCb === 'function') updateCb(0, 0);
                    if (typeof expireCb === 'function') setTimeout(expireCb, 10);
                }
            }, tickMs);

            return { stop: stopSharedLocalCountdown };
        }

        function stopSharedLocalCountdown() {
            if (window.sharedLocalInterval) {
                clearInterval(window.sharedLocalInterval);
                window.sharedLocalInterval = null;
            }
        }

        socket.on('leader_disconnected', function(data) {});
        socket.on('leader_reconnected', function(data) {});
        socket.on('leader_offline', function(data) {});

        socket.on('player_connection_changed', function(data) {
            // Stille Verarbeitung – keine Popup-Benachrichtigung
        });

        // ── Globale Navigation: funktioniert auf jeder Seite ──────────────────
        // Spieler werden weitergeleitet egal auf welcher Seite sie gerade sind.
        // Leader wird nie automatisch weitergeleitet (er steuert das Spiel).

        socket.on('next_round_started', function(data) {
            if (isLeader || !currentRoomId) return;
            setTimeout(() => {
                window.location.href = `/game/${data.room_id}`;
            }, 300);
        });

        socket.on('game_finished', function(data) {
            if (isLeader || !currentRoomId) return;
            setTimeout(() => {
                window.location.href = `/evaluation/${data.room_id}`;
            }, 500);
        });

        // Fallback: Falls ein Spieler ein Event verpasst hat (z.B. während
        // einer Seitennavigation), prüft room_state_update den aktuellen Status
        // und leitet bei Bedarf sofort weiter.
        socket.on('room_state_update', function(data) {
            if (!currentRoomId) return;
            const path = window.location.pathname;
            const status = data.room_status || data.status;

            if (isLeader) {
                // Leader: zurück zum Dashboard wenn auf falscher Seite gelandet
                const onLeaderGamePage = path.startsWith('/leader_dashboard/') ||
                                         path.startsWith('/game_room/');
                if ((status === 'playing' || status === 'round_results') &&
                        !path.startsWith('/leader_dashboard/')) {
                    window.location.href = `/leader_dashboard/${currentRoomId}`;
                } else if (status === 'finished' && onLeaderGamePage) {
                    window.location.href = `/evaluation/${currentRoomId}`;
                }
                return;
            }

            // Spieler: Nur auf Spielseiten weiterleiten – nie von index/evaluation wegdrängen
            const onGamePage = path.startsWith('/game/') ||
                               path.startsWith('/round_results/') ||
                               path.startsWith('/game_room/');

            if (status === 'playing' && !path.startsWith('/game/')) {
                window.location.href = `/game/${currentRoomId}`;
            } else if (status === 'round_results' && !path.startsWith('/round_results/')) {
                window.location.href = `/round_results/${currentRoomId}`;
            } else if (status === 'finished' && onGamePage) {
                // Nur weiterleiten wenn Spieler noch auf einer Spielseite steckt
                window.location.href = `/evaluation/${currentRoomId}`;
            }
        });

        // Raum wurde vom Leader geschlossen – globaler Handler für alle Seiten
        socket.on('room_closed', function(data) {
            if (!currentRoomId) return;
            localStorage.removeItem('gueterspiel_session');
            // Leader hat selbst abgebrochen – executeAbortGame() übernimmt die
            // Weiterleitung. Ohne diesen Guard würden zwei konkurrierende Redirects
            // laufen (room_closed 500 ms vs. abort-Timeout 600 ms).
            if (window.isManuallyAborting) return;
            const reason = data.reason ? encodeURIComponent(data.reason) : '';
            setTimeout(() => {
                window.location.href = reason ? `/?reason=${reason}` : '/';
            }, 500);
        });

        // Leader hat Raum zurück in die Lobby versetzt
        socket.on('return_to_lobby', function(data) {
            if (!currentRoomId) return;
            setTimeout(() => {
                window.location.href = `/game_room/${data.room_id}`;
            }, 300);
        });
    </script>
    
    {% block scripts %}{% endblock %}
</body>
</html>
