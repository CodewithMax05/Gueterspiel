{% extends "base.html" %}

{% block head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/history.css') }}">
{% endblock %}

{% block body %}
<div class="container">
    <div class="page-title-row">
        <h1>📜 Spielhistorie</h1>
        <a href="{{ url_for('index') }}" class="btn btn-secondary btn-back">
            <i class="fas fa-arrow-left"></i> Zurück
        </a>
    </div>

    <p class="history-hint">Abgeschlossene Spiele werden 7 Tage lang gespeichert.</p>

    <div class="history-controls">
        <div class="history-search">
            <i class="fas fa-search"></i>
            <input type="text" id="historySearch" placeholder="Raum-ID oder Spielleiter suchen…" autocomplete="off">
        </div>
        <select id="historySort" class="history-sort" aria-label="Sortierung">
            <option value="newest">Neueste zuerst</option>
            <option value="oldest">Älteste zuerst</option>
        </select>
    </div>

    <div class="history-list" id="historyList">
        <p class="loading-text">Lade History…</p>
        <div id="historyLoadingIndicator" class="loading-indicator" style="display:none;">
            <i class="fas fa-spinner fa-spin"></i> Lade weitere Einträge…
        </div>
        <div id="historySentinel" class="scroll-sentinel"></div>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // ----------------------------------------------------------------
    // Zustand: Infinite-Scroll + Filter
    // ----------------------------------------------------------------
    let historyPage     = 1;
    let historyLoading  = false;
    let historyHasMore  = true;
    let currentSort     = 'newest';
    let currentQuery    = '';
    let searchDebounce  = null;
    const HISTORY_LIMIT = 10;

    document.addEventListener('DOMContentLoaded', function() {
        const historyList = document.getElementById('historyList');
        const sentinel    = document.getElementById('historySentinel');

        // Sentinel bleibt dauerhaft im DOM (wird beim Reset NICHT entfernt),
        // damit der Observer zuverlässig weiter feuert.
        const historyObserver = new IntersectionObserver(entries => {
            if (entries[0].isIntersecting && !historyLoading && historyHasMore) {
                loadMoreHistory();
            }
        }, { root: historyList, rootMargin: '150px' });
        if (sentinel) historyObserver.observe(sentinel);

        // Sortierung
        const sortSelect = document.getElementById('historySort');
        if (sortSelect) {
            sortSelect.addEventListener('change', function() {
                currentSort = this.value;
                resetAndReloadHistory();
            });
        }

        // Suche (entprellt, damit nicht bei jedem Tastendruck gefetcht wird)
        const searchInput = document.getElementById('historySearch');
        if (searchInput) {
            searchInput.addEventListener('input', function() {
                const val = this.value.trim();
                clearTimeout(searchDebounce);
                searchDebounce = setTimeout(() => {
                    currentQuery = val;
                    resetAndReloadHistory();
                }, 300);
            });
        }

        loadMoreHistory();
    });

    // ----------------------------------------------------------------
    // Lade-Logik
    // ----------------------------------------------------------------
    function clearHistoryItems() {
        document.querySelectorAll('#historyList .history-item, #historyList .empty-text, #historyList .loading-text')
            .forEach(el => el.remove());
    }

    function resetAndReloadHistory() {
        historyPage    = 1;
        historyHasMore = true;
        historyLoading = false;
        clearHistoryItems();
        loadMoreHistory();
    }

    function loadMoreHistory() {
        if (historyLoading || !historyHasMore) return;
        historyLoading = true;

        const indicator = document.getElementById('historyLoadingIndicator');
        if (indicator) indicator.style.display = 'flex';

        const params = new URLSearchParams({
            page:  historyPage,
            limit: HISTORY_LIMIT,
            sort:  currentSort,
            q:     currentQuery,
        });

        fetch(`/api/history?${params.toString()}`)
            .then(r => r.json())
            .then(data => {
                const list      = document.getElementById('historyList');
                const indicator = document.getElementById('historyLoadingIndicator');

                // Beim ersten Batch (Erst-Load oder Reset) alte Inhalte entfernen
                // – Sentinel + Indikator bleiben erhalten.
                if (historyPage === 1) clearHistoryItems();

                if (data.items.length === 0 && historyPage === 1) {
                    const p = document.createElement('p');
                    p.className = 'empty-text';
                    p.textContent = currentQuery
                        ? 'Keine Treffer für deine Suche.'
                        : 'Noch keine abgeschlossenen Spiele vorhanden.';
                    list.insertBefore(p, indicator);
                } else {
                    data.items.forEach(entry => {
                        list.insertBefore(buildHistoryElement(entry), indicator);
                    });
                }

                historyHasMore = data.has_more;
                historyPage++;
                historyLoading = false;
                if (indicator) indicator.style.display = 'none';

                // Falls die Liste noch nicht scrollbar ist, direkt weiterladen
                if (historyHasMore && list.scrollHeight <= list.clientHeight) {
                    loadMoreHistory();
                }
            })
            .catch(() => {
                historyLoading = false;
                const indicator = document.getElementById('historyLoadingIndicator');
                if (indicator) indicator.style.display = 'none';
                if (historyPage === 1) {
                    clearHistoryItems();
                    const list = document.getElementById('historyList');
                    const p = document.createElement('p');
                    p.className = 'empty-text';
                    p.textContent = 'Fehler beim Laden der Spielhistorie.';
                    list.insertBefore(p, document.getElementById('historyLoadingIndicator'));
                }
            });
    }

    function buildHistoryElement(entry) {
        const date    = new Date(entry.completed_at * 1000);
        const dateStr = date.toLocaleDateString('de-DE', {
            day: '2-digit', month: '2-digit', year: 'numeric',
            hour: '2-digit', minute: '2-digit'
        });
        const roundLabel = entry.current_round === 1 ? '1 Runde' : `${entry.current_round} Runden`;

        const el = document.createElement('div');
        el.className = 'history-item';
        el.innerHTML = `
            <div class="history-info">
                <div class="history-title">
                    <strong>Raum ${entry.room_id}</strong>
                    <span class="history-date">${dateStr}</span>
                </div>
                <div class="history-meta">
                    <span><i class="fas fa-user-tie"></i> ${escHtml(entry.leader_name)}</span>
                    <span><i class="fas fa-layer-group"></i> ${roundLabel}</span>
                    <span><i class="fas fa-users"></i> ${entry.total_players} Spieler</span>
                    <span><i class="fas fa-coins"></i> ${entry.settings.initial_coins} Coins &nbsp;·&nbsp; ×${entry.settings.multiplier}</span>
                </div>
            </div>
            <div class="history-actions">
                <a href="/history/${entry.room_id}" class="btn btn-secondary" title="Auswertung ansehen">
                    <i class="fas fa-eye"></i>
                </a>
            </div>
        `;
        return el;
    }
</script>
{% endblock %}
